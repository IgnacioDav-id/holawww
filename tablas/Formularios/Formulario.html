<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formularios</title>
  </head>
  <body>
    <!--HEADER cabecera del body-->
    <header>
      <h1>Formulario</h1>
    </header>
    <!--formulario-->
    <div>
      <form action="../../index.html" method="get">
        <!--LABEL= me permite ingresar texto fijo-->
        <!--input = caja para ingresar texto-->
        <!--div para cada label-->
        <!--Todo label tiene que tener un for y todo input debe tener un id igual al for-->
        <div>
          <label for="nombre">Ingrese el nombre</label>
          <input type="text" id="nombre"/>
        </div>
        <div>
          <label for="edad">Edad</label>
          <input type="number" id="edad"/>
        </div>
        <div>
          <label for="email">Correo</label>
          <input type="email" id="email"/>
        </div>
        <div>
            <label for="direccion">Direccion</label>
            <input type="text" id="direccion">
        </div>
        <!--Boton submit me permite enviar la peticion con informacion-->
        <div>
            <input type="submit" value="Enviar">
        </div>
      </form>
    </div>
    <!--Regresar a home-->
    <div>
      <a href="../../index.html">Ir a home</a>
    </div>
    <div>
      <a href="FormularioRegistro.html">Formulario de Registro e Informacion</a>
    </div>
    <div>
      <a href="../tabla.html">Ir a Productos</a>
    </div>
  </body>
</html>
